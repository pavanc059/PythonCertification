# Production overrides — used alongside docker-compose.yml on the VPS.
#
# Usage on server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# This file:
#   - Adds the Nginx reverse proxy with SSL
#   - Removes host-port exposure for internal services (DB, Redis stay internal)
#   - Sets restart: always instead of unless-stopped

services:
  # ── Nginx reverse proxy (public entry point) ───────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: stockiq-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro      # mount your TLS certs here
    depends_on:
      - backend
      - frontend
    networks:
      - stockiq-network
    restart: always

  # ── Remove direct port exposure for internal services ─────────────────────
  timescaledb:
    ports: []           # DB no longer reachable from outside
    restart: always

  redis:
    ports: []           # Redis no longer reachable from outside
    restart: always

  backend:
    ports: []           # Only accessible via Nginx
    restart: always

  frontend:
    ports: []           # Only accessible via Nginx
    restart: always

  celery-worker:
    restart: always

  celery-beat:
    restart: always

  autopilot-worker:
    restart: always

  autopilot-beat:
    restart: always
