# Redis Sentinel Configuration for High Availability
# Implements production high availability as per Requirements 22.1-22.4

# ==================== GENERAL ====================
port 26379
daemonize no
pidfile /var/run/redis-sentinel.pid
logfile /var/log/redis/sentinel.log

# Working directory
dir /tmp

# ==================== SENTINEL MONITORING ====================
# sentinel monitor <master-name> <ip> <port> <quorum>
# Quorum: minimum number of sentinels that must agree for a failover
# For 3 sentinel setup, use quorum = 2
sentinel monitor stockiq-master 127.0.0.1 6379 2

# Authentication password for Redis master/replicas
# sentinel auth-pass <master-name> <password>
# sentinel auth-pass stockiq-master your_redis_password

# ==================== FAILOVER CONFIGURATION ====================
# Time in milliseconds a master should be unreachable to consider it down
sentinel down-after-milliseconds stockiq-master 5000

# Timeout for failover operation
sentinel failover-timeout stockiq-master 60000

# Maximum number of replicas that can sync with master simultaneously during failover
sentinel parallel-syncs stockiq-master 1

# ==================== NOTIFICATION SCRIPTS ====================
# Scripts to run on sentinel events (optional)
# sentinel notification-script <master-name> <script-path>
# sentinel client-reconfig-script <master-name> <script-path>

# Example: Send email notification on failover
# sentinel notification-script stockiq-master /path/to/notification.sh

# Example: Reconfigure application on failover
# sentinel client-reconfig-script stockiq-master /path/to/reconfig.sh

# ==================== SECURITY ====================
# Sentinel password (Redis 5.0.1+)
# requirepass your_sentinel_password

# ==================== ADVANCED ====================
# Prevent Sentinel from running scripts
sentinel deny-scripts-reconfig yes

# Log level
loglevel notice
