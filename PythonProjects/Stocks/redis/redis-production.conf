# Redis 7.0+ Production Configuration for StockIQ
# Optimized for production workloads with enhanced security and performance

# Include base configuration
# include /etc/redis/redis.conf

# ==================== NETWORK ====================
bind 0.0.0.0
port 6379
timeout 300
tcp-backlog 511
tcp-keepalive 300

# ==================== GENERAL ====================
daemonize no
pidfile /var/run/redis_6379.pid
loglevel notice
logfile /var/log/redis/redis-server.log
databases 16

# ==================== SNAPSHOTTING (RDB) ====================
save 900 1
save 300 10
save 60 10000

rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Stop accepting writes if RDB snapshots fail
stop-writes-on-bgsave-error yes

# ==================== APPEND ONLY FILE (AOF) ====================
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

aof-load-truncated yes
aof-use-rdb-preamble yes

# Stop accepting writes if AOF fails
aof-rewrite-incremental-fsync yes

# ==================== MEMORY MANAGEMENT ====================
# Production memory limit (adjust based on server)
maxmemory 4gb

# Use LRU eviction for cache workload
maxmemory-policy allkeys-lru
maxmemory-samples 10

# ==================== LAZY FREEING ====================
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# ==================== THREADED I/O ====================
# Increase for multi-core servers (typically num_cores / 2)
io-threads 8
io-threads-do-reads yes

# ==================== SECURITY ====================
# REQUIRED: Set strong password in production
requirepass ${REDIS_PASSWORD}

# Disable dangerous commands
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG_a8f5e7b2c9d1"
rename-command SHUTDOWN "SHUTDOWN_f9e3a2d7b5c1"
rename-command BGREWRITEAOF "BGREWRITEAOF_c4e8f1a3b9d7"
rename-command BGSAVE "BGSAVE_e2d9c5a1f7b3"
rename-command SAVE ""
rename-command DEBUG ""

# Enable protected mode
protected-mode yes

# ==================== REPLICATION ====================
# Announce IP and port to Sentinel (replace with actual values)
# replica-announce-ip 10.0.1.100
# replica-announce-port 6379

# Use diskless replication for faster replica sync
repl-diskless-sync yes
repl-diskless-sync-delay 5

# ==================== LIMITS ====================
maxclients 50000

# ==================== SLOW LOG ====================
slowlog-log-slower-than 10000
slowlog-max-len 256

# ==================== LATENCY MONITOR ====================
latency-monitor-threshold 100

# ==================== EVENT NOTIFICATION ====================
notify-keyspace-events Ex

# ==================== MONITORING ====================
# Enable performance stats
extended-redis-info yes

# ==================== ADVANCED CONFIG ====================
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

list-max-ziplist-size -2
list-compress-depth 0

set-max-intset-entries 512

zset-max-ziplist-entries 128
zset-max-ziplist-value 64

hll-sparse-max-bytes 3000

stream-node-max-bytes 4096
stream-node-max-entries 100

activerehashing yes

client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 512mb 128mb 60
client-output-buffer-limit pubsub 64mb 16mb 60

hz 10

# Enhanced active defragmentation for production
activedefrag yes
active-defrag-ignore-bytes 200mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 10
active-defrag-cycle-max 75
active-defrag-max-scan-fields 1000

# Jemalloc background thread
jemalloc-bg-thread yes

# ==================== PERSISTENCE GUARANTEES ====================
# Ensure data durability
appendfsync everysec
no-appendfsync-on-rewrite no

# ==================== PERFORMANCE TUNING ====================
# Optimize for throughput
rdb-save-incremental-fsync yes

# TCP optimization
tcp-backlog 1024
