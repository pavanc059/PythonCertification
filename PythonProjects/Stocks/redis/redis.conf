# Redis 7.0+ Configuration for StockIQ
# This configuration implements Requirements 22.1-22.4 for caching and pub/sub

# ==================== NETWORK ====================
# Bind to all interfaces (use firewall for security in production)
bind 0.0.0.0

# Accept connections on port 6379
port 6379

# Close connection after client idle for N seconds (0 to disable)
timeout 300

# TCP listen backlog
tcp-backlog 511

# TCP keepalive (seconds)
tcp-keepalive 300


# ==================== GENERAL ====================
# Run as a daemon (yes for production, no for Docker)
daemonize no

# Process ID file
pidfile /var/run/redis_6379.pid

# Log level: debug, verbose, notice, warning
loglevel notice

# Log file (empty string = log to stdout)
logfile ""

# Number of databases
databases 16


# ==================== SNAPSHOTTING (RDB) ====================
# Save the DB on disk:
# save <seconds> <changes>
# Will save the DB if both the given number of seconds and the given
# number of write operations against the DB occurred.

# Save after 900 seconds (15 min) if at least 1 key changed
save 900 1

# Save after 300 seconds (5 min) if at least 10 keys changed
save 300 10

# Save after 60 seconds if at least 10000 keys changed
save 60 10000

# Compress RDB files using LZF
rdbcompression yes

# Checksum RDB files
rdbchecksum yes

# RDB filename
dbfilename dump.rdb

# Working directory
dir /data


# ==================== APPEND ONLY FILE (AOF) ====================
# Enable AOF persistence
appendonly yes

# AOF filename
appendfilename "appendonly.aof"

# fsync policy: always, everysec, no
# everysec = good compromise between performance and durability
appendfsync everysec

# Rewrite AOF file when it grows by this percentage
auto-aof-rewrite-percentage 100

# Minimum AOF file size to trigger rewrite
auto-aof-rewrite-min-size 64mb

# Load truncated AOF file on startup
aof-load-truncated yes

# Use RDB-AOF hybrid format for faster restarts
aof-use-rdb-preamble yes


# ==================== MEMORY MANAGEMENT ====================
# Maximum memory limit (adjust based on server capacity)
# Development: 512MB
# Production: 2GB-8GB depending on server specs
maxmemory 512mb

# Memory eviction policy when maxmemory is reached
# allkeys-lru: Evict any key using LRU algorithm (good for cache)
# volatile-lru: Evict keys with TTL using LRU (good for mixed workload)
# allkeys-lfu: Evict any key using LFU algorithm (frequency-based)
maxmemory-policy allkeys-lru

# LRU/LFU sample size (larger = more accurate but slower)
maxmemory-samples 5


# ==================== LAZY FREEING ====================
# Delete asynchronously to avoid blocking
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes


# ==================== THREADED I/O ====================
# Number of I/O threads (Redis 6.0+)
# Set to number of CPU cores for better performance
# 0 = disabled (single-threaded)
io-threads 4
io-threads-do-reads yes


# ==================== SECURITY ====================
# Require password for connections (CHANGE IN PRODUCTION!)
# requirepass your_strong_password_here

# Disable dangerous commands in production
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG ""
# rename-command SHUTDOWN ""


# ==================== REPLICATION ====================
# Replication configuration (for Redis Sentinel)
# replica-announce-ip <ip>
# replica-announce-port <port>


# ==================== LIMITS ====================
# Max number of clients
maxclients 10000


# ==================== SLOW LOG ====================
# Log queries slower than this many microseconds
slowlog-log-slower-than 10000

# Maximum number of slow log entries
slowlog-max-len 128


# ==================== LATENCY MONITOR ====================
# Enable latency monitoring
latency-monitor-threshold 100


# ==================== EVENT NOTIFICATION ====================
# Enable keyspace notifications for expired keys (useful for TTL tracking)
notify-keyspace-events Ex


# ==================== ADVANCED CONFIG ====================
# Hash optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List optimization  
list-max-ziplist-size -2
list-compress-depth 0

# Set optimization
set-max-intset-entries 512

# Sorted set optimization
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation optimization
hll-sparse-max-bytes 3000

# Streams optimization
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Frequency of rehashing the main dictionary
hz 10

# Enable active defragmentation
activedefrag yes
active-defrag-ignore-bytes 100mb
active-defrag-threshold-lower 10
active-defrag-threshold-upper 100
active-defrag-cycle-min 5
active-defrag-cycle-max 75
