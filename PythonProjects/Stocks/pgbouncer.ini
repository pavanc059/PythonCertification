;; pgbouncer configuration for StockIQ
;; Connection pooler for PostgreSQL to improve performance and manage connections
;;
;; Installation:
;;   - Ubuntu/Debian: sudo apt-get install pgbouncer
;;   - macOS: brew install pgbouncer
;;   - Windows: Download from https://www.pgbouncer.org/downloads.html
;;
;; Start: pgbouncer -d pgbouncer.ini
;; Admin console: psql -h 127.0.0.1 -p 6432 -U postgres pgbouncer

[databases]
;; Database connection strings
;; Format: dbname = host=hostname port=port dbname=dbname
stockiq = host=127.0.0.1 port=5432 dbname=stockiq

;; For multiple databases, add more lines:
;; stockiq_test = host=127.0.0.1 port=5432 dbname=stockiq_test

[pgbouncer]
;;;
;;; Administrative settings
;;;

;; Log file location
logfile = logs/pgbouncer.log

;; PID file location
pidfile = logs/pgbouncer.pid

;;;
;;; Connection pooling settings
;;;

;; Pooling mode
;; - session: Server is released back to pool after client disconnects (default)
;; - transaction: Server is released back to pool after transaction finishes
;; - statement: Server is released back to pool after query finishes (not recommended)
pool_mode = transaction

;; Maximum number of client connections allowed
max_client_conn = 200

;; Default pool size per user/database pair
;; Recommended: Set to database_pool_size from config.py (default: 10)
default_pool_size = 10

;; Minimum pool size per user/database pair
min_pool_size = 5

;; Reserve pool size - how many additional connections to allow per database pair
;; Recommended: Set to database_max_overflow from config.py (default: 20)
reserve_pool_size = 20

;; How long to wait when all connections are busy
;; 0 = unlimited, abort if wait queue is full
reserve_pool_timeout = 5

;; Maximum time a client connection can be idle before being closed
;; 0 = unlimited
server_idle_timeout = 600

;; Maximum lifetime of a server connection
;; 0 = unlimited
server_lifetime = 3600

;; Lifetime of an idle connection
;; 0 = unlimited
server_connect_timeout = 15

;; Query timeout
;; 0 = unlimited
query_timeout = 0

;; Maximum time a client is allowed to be idle while in a transaction
;; 0 = unlimited
idle_transaction_timeout = 0

;;;
;;; TCP settings
;;;

;; Listen address
listen_addr = 127.0.0.1

;; Listen port
listen_port = 6432

;; Unix socket directory
;; Set to empty to disable
unix_socket_dir = 

;; TCP keepalive settings
tcp_keepalive = 1
tcp_keepidle = 60
tcp_keepintvl = 10
tcp_keepcnt = 5

;;;
;;; Authentication settings
;;;

;; Authentication type
;; - trust: No authentication
;; - plain: Clear-text password
;; - md5: MD5-hashed password
;; - scram-sha-256: SCRAM-SHA-256 (PostgreSQL 10+)
auth_type = md5

;; Authentication file
;; Format: "username" "password"
auth_file = pgbouncer_auth.txt

;;;
;;; Logging settings
;;;

;; Logging verbosity
;; 0 = quiet, 1 = fatal, 2 = error, 3 = warning, 4 = info, 5 = debug
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

;; Log statistics
stats_period = 60

;;;
;;; Admin console settings
;;;

;; Admin users
;; Format: username1,username2,...
admin_users = postgres

;; Statistics users
;; Format: username1,username2,...
stats_users = postgres

;;;
;;; Security settings
;;;

;; Ignore startup parameters
;; These are sent by some clients but not needed by pgbouncer
ignore_startup_parameters = extra_float_digits,options

;; Maximum size of SQL command
;; 0 = unlimited
max_prepared_statements = 0

;;;
;;; Performance tuning
;;;

;; DNS lookup caching
;; 0 = use system default
dns_max_ttl = 15

;; DNS negative lookup caching
dns_nxdomain_ttl = 15

;; DNS zone check interval
dns_zone_check_period = 0

;; Resolve hostnames on connect
;; no = resolve on first use only
resolve_dns_names = no
