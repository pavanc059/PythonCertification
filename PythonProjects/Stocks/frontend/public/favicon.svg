<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background pill -->
  <rect width="64" height="64" rx="14" fill="#0f1729"/>

  <!-- Chart line: rises left-to-right with a sharp uptick -->
  <polyline
    points="8,46  20,36  30,40  40,24  56,12"
    stroke="#6366f1"
    stroke-width="4.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />

  <!-- Glowing dot at the top right of the trend line -->
  <circle cx="56" cy="12" r="4.5" fill="#818cf8"/>
  <circle cx="56" cy="12" r="7" fill="#6366f1" opacity="0.3"/>

  <!-- Small spark bolt in the trough area (signals AI/AutoPilot) -->
  <path
    d="M28 50 L24 57 L29 57 L25 64"
    stroke="#f59e0b"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
</svg>
